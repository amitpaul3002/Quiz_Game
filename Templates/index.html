<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Quiz Game</title>
  <!-- Tailwind Reset (optional) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(to bottom right, #7e22ce, #3b82f6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: white;
      overflow: hidden;
    }

    /* Fade in animation */
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 1.2s ease-in-out forwards;
    }

    /* Glowing button animation */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(255,255,255,0.6); }
      50% { box-shadow: 0 0 25px rgba(255,255,255,1); }
    }
    .glow-btn {
      background: white;
      color: #7e22ce;
      font-weight: 700;
      font-size: 1.125rem; /* text-lg */
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      transition: transform 0.3s ease-in-out, background 0.3s ease-in-out;
      animation: pulseGlow 2s infinite;
      text-decoration: none;
      display: inline-block;
    }
    .glow-btn:hover {
      transform: scale(1.08);
      background: #f3f4f6;
    }

    .main-title {
      font-size: 3rem; /* text-5xl */
      font-weight: 800;
      text-align: center;
      margin-bottom: 1rem;
    }
    .tagline {
      font-size: 1.25rem; /* text-xl */
      font-weight: 500;
      text-align: center;
      margin-bottom: 2.5rem;
      color: #e0e7ff;
    }

    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 1.5rem;
      animation: fadeIn 1.2s ease-in-out forwards;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
  <!-- Logo at top center -->
  <i class="fa-solid fa-lightbulb fa-5x" style="color:white; margin-bottom:1rem;"
       class="logo fade-in" 
       style="animation-delay: 0s;"></i>
  
  <h1 class="main-title fade-in" style="animation-delay: 0.4s;">
    Welcome to Quiz Game
  </h1>
  <p class="tagline fade-in" style="animation-delay: 0.8s;">
    Test your knowledge and challenge your brain!
  </p>
  
  <a href="/start-quiz" class="glow-btn fade-in" style="animation-delay: 1.2s;">
    Start Quiz
</a>

  </a>

</body>
</html>
